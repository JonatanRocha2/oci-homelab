name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        shell: bash
        run: bash scripts/install-tofu.sh

      - name: Install Ansible
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 -m venv .venv; then
            sudo apt-get update
            sudo apt-get install -y python3-venv
            python3 -m venv .venv
          fi
          .venv/bin/pip install --disable-pip-version-check --require-virtualenv -r requirements-ci.txt
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Validate without cloud credentials
        shell: bash
        env:
          OCI_CLI_AUTH: ""
          OCI_CLI_CONFIG_FILE: ""
        run: |
          set -euo pipefail
          test ! -f "${HOME}/.oci/config"
          ./scripts/ci.sh
